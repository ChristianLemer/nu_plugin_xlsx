[package]
name = "nu_plugin_xlsx"
version = "0.3.1"
edition = "2021"
# The nu-* crates set the floor, and it rises with each Nushell minor: 1.93.1
# for 0.113, 1.95.0 for 0.114 and 0.115, 1.96.1 for 0.116. Declared as the
# highest across supported-nu.txt, so every variant — the one on crates.io
# included — says so plainly instead of failing deep inside a dependency. Raise
# it when a newer minor is added.
rust-version = "1.96.1"
description = "Write Nushell tables to Excel as real Excel Tables, typed and ready to sort."
license = "MIT"
readme = "README.md"
repository = "https://github.com/ChristianLemer/nu_plugin_xlsx"
keywords = ["nushell", "plugin", "xlsx", "excel"]
categories = ["command-line-utilities"]
# What a `cargo install` user needs is the source, the manifest, the licence and
# the two documents that explain the thing. The rest is how this repository is
# run, and shipping it to every installer is noise.
exclude = [
  ".github/",
  ".coderabbit.yaml",
  ".gitignore",
  "AGENTS.md",
  "orca.yaml",
  "scripts/",
  "*.code-workspace",
]

[dependencies]
nu-plugin = "0.113.0"
nu-protocol = { version = "0.113.0", features = ["plugin"] }
chrono = "0.4"
rust_xlsxwriter = { version = "0.99", features = ["chrono", "zmij"] }

[dev-dependencies]
calamine = "0.26"
# Reading a column width means reading the sheet XML: calamine does not expose it.
zip = "8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
unwrap_used = "deny"

[lints.rust]
unsafe_code = "deny"
