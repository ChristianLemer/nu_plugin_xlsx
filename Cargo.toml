[package]
name = "nu_plugin_xlsx"
version = "0.3.0+nu-0.115.1"
edition = "2021"
# rust_xlsxwriter 0.99 pulls zip 8, which requires 1.88. Declared so cargo says
# so plainly, instead of failing deep inside a dependency — this project exists
# partly for people on distributions that lag.
rust-version = "1.88"
description = "A Nushell plugin for writing Excel (.xlsx) files"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ChristianLemer/nu_plugin_xlsx"
keywords = ["nushell", "plugin", "xlsx", "excel"]
categories = ["command-line-utilities"]
# What a `cargo install` user needs is the source, the manifest, the licence and
# the two documents that explain the thing. The rest is how this repository is
# run, and shipping it to every installer is noise.
exclude = [
  ".github/",
  ".coderabbit.yaml",
  ".gitignore",
  "CLAUDE.md",
  "scripts/",
  "*.code-workspace",
]

[dependencies]
nu-plugin = "=0.115.1"
nu-protocol = { version = "=0.115.1", features = ["plugin"] }
chrono = "0.4"
rust_xlsxwriter = { version = "0.99", features = ["chrono", "zmij"] }

[dev-dependencies]
calamine = "0.26"
# Reading a column width means reading the sheet XML: calamine does not expose it.
zip = "8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
unwrap_used = "deny"

[lints.rust]
unsafe_code = "deny"
